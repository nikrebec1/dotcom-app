<h1>Log in</h1>
<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
<div>
  <label for="id">ID:</label>
  <input id="id" formControlName="id" type="text"/>
  <div class="error">
    <small *ngIf="userForm.get('id')?.invalid && userForm.get('id')?.dirty">
      ID is required (numbers only)
    </small>
  </div>
</div>

<div>
  <label>Password:</label>
  <input [type]="passwordVisible ? 'text' : 'password'" formControlName="password" type="text" />
  <div (click)="togglePasswordVisibility()">

  </div>
  <div class="error">
    <small *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.dirty">
      Password is required (3-20 characters).
    </small>
  </div>
</div>

  <button type="submit" [disabled]="userForm.invalid" (click)="onSubmit()">Log In</button>

</form>


<div *ngIf="showSuccessPopup" class="modal show d-block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Success</h5>
        <button type="button" class="btn-close" (click)="showSuccessPopup = false; navigateImmediately()"></button>
      </div>
      <div class="modal-body">
        <p>Login Successful!</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="showSuccessPopup = false; navigateImmediately()">OK</button>
      </div>
    </div>
  </div>
</div>
